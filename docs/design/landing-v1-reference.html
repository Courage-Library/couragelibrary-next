<title>Courage Library Landing Design</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
<style>
/* Board chrome follows the viewer theme; the landing mock is the real light-mode page */
:root{--pg-bg:#ECEEF3;--pg-fg:#18191B;--pg-muted:#5B6070;--pg-line:#DADDE6;--pg-card:#FFFFFF;--pg-sel:#18191B;--pg-onsel:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg-bg:#111214;--pg-fg:#F1F2F5;--pg-muted:#A9AEBB;--pg-line:#2E3034;--pg-card:#1C1D20;--pg-sel:#F1F2F5;--pg-onsel:#18191B;color-scheme:dark}}
:root[data-theme="dark"]{--pg-bg:#111214;--pg-fg:#F1F2F5;--pg-muted:#A9AEBB;--pg-line:#2E3034;--pg-card:#1C1D20;--pg-sel:#F1F2F5;--pg-onsel:#18191B;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--pg-bg);color:var(--pg-fg);font:15px/1.55 Inter,system-ui,sans-serif}
.board{max-width:1280px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.bar h1{font:600 clamp(18px,2.4vw,22px) Poppins,sans-serif;margin:0}
.bar p{margin:2px 0 0;color:var(--pg-muted);font-size:13.5px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--pg-line);border-radius:999px;padding:3px;gap:2px;background:var(--pg-card)}
.seg button{font:600 13px Inter,sans-serif;border:0;background:transparent;color:var(--pg-fg);padding:7px 14px;border-radius:999px;cursor:pointer;transition:background-color .15s ease-out}
.seg button[aria-pressed="true"]{background:var(--pg-sel);color:var(--pg-onsel)}
.stage{display:flex;justify-content:center}
.frame{width:100%;transition:max-width .25s ease-out}
.frame.phone{max-width:390px}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #475BFF;outline-offset:2px}

/* ================= LANDING PAGE (light mode) ================= */
.lp{container-type:inline-size;background:#FFFFFF;color:#18191B;border-radius:16px;overflow:hidden;border:1px solid var(--pg-line);box-shadow:0 18px 60px rgba(24,25,27,.10);font:16px/1.6 Inter,"Noto Sans Devanagari",system-ui,sans-serif}
.lp.hi{font-family:"Noto Sans Devanagari",Inter,sans-serif;font-size:17px}
.lp h2,.lp h3,.lp .disp{font-family:Poppins,"Noto Sans Devanagari",sans-serif}
.lp.hi h2,.lp.hi h3,.lp.hi .disp{font-family:"Noto Sans Devanagari",Poppins,sans-serif}
.in{max-width:1080px;margin:0 auto;padding:0 28px}
@container (max-width:600px){.in{padding:0 18px}}
.why{display:none}
.lp.show-why .why{display:flex;gap:8px;align-items:flex-start;max-width:1080px;margin:0 auto 18px;padding:9px 12px;border:1.5px dashed #F2B8A8;background:#FFF7F4;border-radius:10px;font:12.5px/1.45 Inter,sans-serif;color:#7A3A27;text-align:left}
.lp.show-why .why b{flex:none;font-weight:700}

/* header */
.hd{position:sticky;top:0;z-index:3;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid #ECEEF3}
.hd .in{display:flex;align-items:center;gap:22px;height:66px}
.lock{display:flex;align-items:center;gap:9px;font:600 17px Poppins,sans-serif;white-space:nowrap;color:inherit;text-decoration:none}
.nav{display:flex;gap:22px;font-size:14.5px;color:#5B6070}
.nav a{color:inherit;text-decoration:none;transition:color .15s ease-out}
.nav a:hover{color:#18191B}
.sp{flex:1}
.lang{display:inline-flex;border:1px solid #E1E4EC;border-radius:999px;padding:2px;font:600 12.5px Inter,"Noto Sans Devanagari",sans-serif}
.lang button{border:0;background:transparent;color:#5B6070;padding:5px 10px;border-radius:999px;cursor:pointer;font:inherit}
.lang button[aria-pressed="true"]{background:#EEF0FF;color:#3A4BEB}
.signin{font-weight:600;font-size:14.5px;color:#18191B;text-decoration:none}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 24px;border-radius:999px;font:600 15px Inter,"Noto Sans Devanagari",sans-serif;text-decoration:none;cursor:pointer;border:0;white-space:nowrap;transition:background-color .15s ease-out,box-shadow .15s ease-out,transform .1s ease-out}
.pill:active{transform:translateY(1px)}
.pill.pri{background:#475BFF;color:#FFFFFF;box-shadow:0 8px 22px rgba(71,91,255,.30)}
.pill.pri:hover{background:#394EFF;box-shadow:0 10px 28px rgba(71,91,255,.42)}
.pill.light{background:#FFFFFF;color:#2A3587}
.pill.light:hover{background:#EEF0FF}
.hd .pill{min-height:38px;padding:0 18px;font-size:14px;box-shadow:none}
.burger{display:none;width:40px;height:40px;border:1px solid #E1E4EC;border-radius:12px;align-items:center;justify-content:center;background:#fff}
.burger i,.burger i::before,.burger i::after{display:block;width:16px;height:2px;background:#18191B;border-radius:2px;position:relative}
.burger i::before,.burger i::after{content:"";position:absolute;left:0}
.burger i::before{top:-5px}.burger i::after{top:5px}
@container (max-width:900px){.nav{display:none}}
@container (max-width:600px){.signin,.hd .pill{display:none}.burger{display:flex}.hd .in{gap:10px;height:60px}}

/* hero */
.hero{position:relative;text-align:center;padding:72px 0 64px;overflow:hidden}
.hero::before{content:"";position:absolute;left:50%;top:-180px;width:1100px;max-width:140%;height:760px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(71,91,255,.15),rgba(71,91,255,0));pointer-events:none}
.hero>*{position:relative}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:#EEF0FF;color:#3A4BEB;font:600 13px Inter,"Noto Sans Devanagari",sans-serif;margin-bottom:20px}
.badge i{width:7px;height:7px;border-radius:50%;background:#475BFF}
.hero h1{font:700 clamp(32px,6cqi,58px)/1.1 Poppins,"Noto Sans Devanagari",sans-serif;letter-spacing:-.015em;margin:0 auto 18px;max-width:17ch;text-wrap:balance}
.lp.hi .hero h1{font-family:"Noto Sans Devanagari",sans-serif;line-height:1.25;max-width:20ch}
.hero h1 span{color:#475BFF}
.hero .sub{color:#5B6070;font-size:clamp(16px,2cqi,18.5px);max-width:52ch;margin:0 auto 28px}
.ctas{display:flex;gap:14px 22px;justify-content:center;align-items:center;flex-wrap:wrap}
.link{color:#3A4BEB;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.tag{margin-top:26px;font:600 15px Poppins,"Noto Sans Devanagari",sans-serif;display:inline-flex;align-items:center;gap:12px}
.tag::before,.tag::after{content:"";width:26px;height:2px;border-radius:2px;background:linear-gradient(90deg,#22E3F2,#4B00E6)}
.loopcard{margin:48px auto 0;max-width:760px;background:#FFFFFF;border:1px solid #E6E8EF;border-radius:24px;box-shadow:0 24px 60px rgba(42,53,135,.10);padding:22px}
.loopcard svg{display:block;width:100%;height:auto}
.loopcard .tall{display:none;max-width:340px;margin:0 auto}
@container (max-width:600px){.loopcard .wide{display:none}.loopcard .tall{display:block}}
@container (max-width:600px){.hero{padding:44px 0 40px}.loopcard{margin-top:32px;padding:10px;border-radius:18px}}

/* find exam band */
.band{background:linear-gradient(135deg,#485BFF 0%,#4262F3 45%,#3973D6 100%);color:#FFFFFF;text-align:center;padding:56px 0}
.band h2{font-size:clamp(26px,4cqi,38px);line-height:1.2;margin:0 0 8px}
.band p{margin:0 auto 24px;opacity:.9;max-width:50ch}
.search{display:flex;align-items:center;gap:10px;background:#18191B;border-radius:999px;padding:7px 7px 7px 24px;max-width:600px;margin:0 auto;box-shadow:0 16px 40px rgba(17,22,80,.35)}
.search span{flex:1;text-align:left;color:#A9AEBB;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search b{flex:none;width:48px;height:48px;border-radius:50%;background:#475BFF;display:flex;align-items:center;justify-content:center}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.chips a{padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;text-decoration:none;font-size:13.5px;font-weight:500;transition:background-color .15s ease-out}
.chips a:hover{background:rgba(255,255,255,.26)}

/* generic section */
.sec{padding:80px 0;text-align:center}
.sec.cloud{background:#F5F6FA}
.sec h2{font-size:clamp(26px,4.2cqi,40px);line-height:1.18;letter-spacing:-.01em;margin:0 auto 12px;max-width:22ch;text-wrap:balance}
.sec .lead{color:#5B6070;margin:0 auto 40px;max-width:56ch;font-size:clamp(15.5px,1.8cqi,17.5px)}
@container (max-width:600px){.sec{padding:56px 0}.sec .lead{margin-bottom:28px}}

/* exams */
.exams{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;text-align:left}
@container (max-width:900px){.exams{grid-template-columns:repeat(3,1fr)}}
@container (max-width:600px){.exams{grid-template-columns:repeat(2,1fr);gap:12px}}
.exam{display:flex;flex-direction:column;background:#FFFFFF;border:1px solid #E6E8EF;border-radius:16px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .18s ease-out,box-shadow .18s ease-out,border-color .18s ease-out;min-width:0}
@media (hover:hover){.exam:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(24,25,27,.10);border-color:#C9CFFF}}
.exam .top{height:84px;display:flex;align-items:center;justify-content:center;color:#FFFFFF}
.exam .top svg{width:32px;height:32px}
.exam .body{padding:14px 16px 16px}
.exam b{display:block;font:600 16px Poppins,"Noto Sans Devanagari",sans-serif}
.exam small{color:#5B6070;font-size:13px;line-height:1.45;display:block;margin-top:2px}
.exam.all{border-style:dashed;background:#F5F6FA}
.exam.all .top{color:#3A4BEB;background:#EEF0FF}
@container (max-width:600px){.exam .top{height:66px}.exam .body{padding:11px 12px 13px}.exam b{font-size:15px}}

/* pain → answer */
.pains{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;text-align:left}
@container (max-width:800px){.pains{grid-template-columns:1fr;max-width:560px;margin:0 auto}}
.pain{background:#FFFFFF;border:1px solid #E6E8EF;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.pain q{quotes:none;font:600 17px/1.4 Poppins,"Noto Sans Devanagari",sans-serif;color:#18191B;display:block;padding-left:14px;border-left:3px solid #C9CFFF}
.pain .ans{display:flex;gap:10px;color:#5B6070;font-size:15px}
.pain .ans svg{flex:none;width:22px;height:22px;margin-top:1px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;position:relative;text-align:center;counter-reset:s}
.steps::before{content:"";position:absolute;left:8%;right:8%;top:38px;height:2px;background:repeating-linear-gradient(90deg,#C9CFFF 0 8px,transparent 8px 14px)}
.st{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.st .ic{width:76px;height:76px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#5A6CFF,#2A3587);color:#fff;box-shadow:0 12px 26px rgba(42,53,135,.25)}
.st .ic svg{width:32px;height:32px}
.st.win .ic{background:linear-gradient(135deg,#FF8A6E,#E2502F);box-shadow:0 12px 26px rgba(226,80,47,.28)}
.st .n{font:700 12px Inter,sans-serif;color:#3A4BEB;letter-spacing:.06em}
.st.win .n{color:#C2401F}
.st .tx{display:flex;flex-direction:column;align-items:center;gap:2px}
.st b{font:600 16px Poppins,"Noto Sans Devanagari",sans-serif}
.st p{margin:0;color:#5B6070;font-size:13.5px;line-height:1.5}
@container (max-width:900px){.steps{grid-template-columns:repeat(3,1fr);row-gap:30px}.steps::before{display:none}}
@container (max-width:600px){.steps{grid-template-columns:1fr;gap:0;text-align:left;max-width:440px;margin:0 auto}
 .st{flex-direction:row;align-items:flex-start;gap:16px;padding-bottom:22px}
 .st::after{content:"";position:absolute;left:29px;top:62px;bottom:0;width:2px;background:repeating-linear-gradient(180deg,#C9CFFF 0 6px,transparent 6px 11px)}
 .st:last-child::after{display:none}
 .st .ic{width:60px;height:60px;border-radius:18px;flex:none}.st .ic svg{width:26px;height:26px}
 .st .tx{align-items:flex-start;padding-top:4px}}

/* free */
.free{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;text-align:left;max-width:940px;margin:0 auto}
@container (max-width:760px){.free{grid-template-columns:1fr}}
.fc{border-radius:20px;padding:26px;border:1px solid #E6E8EF;background:#FFFFFF}
.fc.main{border:2px solid #475BFF;box-shadow:0 18px 44px rgba(71,91,255,.14)}
.fc h3{margin:0 0 4px;font-size:21px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fc .tagp{font:700 11.5px Inter,sans-serif;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:#EEF0FF;color:#3A4BEB}
.fc>p{margin:0 0 18px;color:#5B6070;font-size:14.5px}
.fc ul{list-style:none;margin:0 0 22px;padding:0;display:flex;flex-direction:column;gap:11px}
.fc li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.fc li svg{flex:none;width:20px;height:20px;margin-top:2px}
.fc.pro{background:#F5F6FA}
.fc.pro li{color:#5B6070}
.fc .note{font-size:13px;color:#5B6070;margin:0}

/* library (charcoal) */
.lib{background:#18191B;color:#FFFFFF;padding:84px 0;position:relative;overflow:hidden}
.lib::before{content:"";position:absolute;right:-200px;top:-200px;width:700px;height:700px;background:radial-gradient(closest-side,rgba(71,91,255,.28),transparent);pointer-events:none}
.lib .in{position:relative;display:grid;grid-template-columns:1fr 1.15fr;gap:44px;align-items:center}
@container (max-width:860px){.lib .in{grid-template-columns:1fr}}
.lib .eyebrow{font:700 12px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#8FA0FF;margin:0 0 12px}
.lib h2{font-size:clamp(26px,4cqi,38px);line-height:1.18;margin:0 0 14px;text-wrap:balance}
.lib p{color:#C9CDD6;margin:0 0 20px;max-width:46ch}
.facts{list-style:none;margin:0 0 24px;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.facts li{padding:7px 13px;border-radius:999px;background:#25262A;border:1px solid #33353A;font-size:13.5px;color:#E3E5EA}
.pin{display:inline-flex;align-items:center;gap:8px;color:#A9AEBB;font-size:14px}
.photos{display:grid;grid-template-columns:1.4fr 1fr;grid-template-rows:1fr 1fr;gap:12px;height:380px}
.ph{border-radius:16px;background:linear-gradient(135deg,#26272B,#1F2023);border:1.5px dashed #3A3C42;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#8B909C;font-size:13px;text-align:center;padding:12px}
.ph svg{width:28px;height:28px;color:#5B6070}
.ph.big{grid-row:span 2}
@container (max-width:600px){.lib{padding:56px 0}.photos{height:300px}}

/* promises */
.proms{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;text-align:left}
@container (max-width:900px){.proms{grid-template-columns:repeat(2,1fr)}}
@container (max-width:520px){.proms{grid-template-columns:1fr}}
.pr{background:#FFFFFF;border:1px solid #E6E8EF;border-radius:18px;padding:22px}
.pr .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.pr .ic svg{width:24px;height:24px}
.pr b{display:block;font:600 16.5px Poppins,"Noto Sans Devanagari",sans-serif;margin-bottom:6px}
.pr p{margin:0;color:#5B6070;font-size:14.5px}

/* faq */
.faq{max-width:760px;margin:0 auto;text-align:left;display:flex;flex-direction:column;gap:10px}
.faq details{background:#FFFFFF;border:1px solid #E6E8EF;border-radius:14px;padding:0 20px;transition:border-color .2s ease-in-out}
.faq details[open]{border-color:#C9CFFF}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:17px 0;font:600 16px Poppins,"Noto Sans Devanagari",sans-serif}
.faq summary::-webkit-details-marker{display:none}
.faq summary i{flex:none;width:28px;height:28px;border-radius:50%;background:#EEF0FF;position:relative;transition:transform .2s ease-in-out}
.faq summary i::before,.faq summary i::after{content:"";position:absolute;left:8px;right:8px;top:13px;height:2px;background:#3A4BEB;border-radius:2px}
.faq summary i::after{transform:rotate(90deg);transition:opacity .2s ease-in-out}
.faq details[open] summary i::after{opacity:0}
.faq details p{margin:0 0 18px;color:#5B6070;font-size:15px}

/* final cta + footer */
.final{padding:0 0 80px}
.final .box{border-radius:28px;background:linear-gradient(135deg,#485BFF 0%,#4262F3 45%,#3973D6 100%);color:#FFFFFF;text-align:center;padding:56px 24px;position:relative;overflow:hidden}
.final .box::before{content:"";position:absolute;inset:auto -10% -60% auto;width:60%;height:120%;background:radial-gradient(closest-side,rgba(34,227,242,.30),transparent)}
.final .box>*{position:relative}
.final h2{font-size:clamp(26px,4.4cqi,42px);line-height:1.18;margin:0 auto 10px;max-width:20ch;text-wrap:balance}
.final p{opacity:.9;margin:0 auto 26px;max-width:46ch}
@container (max-width:600px){.final{padding-bottom:56px}.final .box{border-radius:20px;padding:40px 18px}}
.ft{background:#18191B;color:#A9AEBB;padding:52px 0 30px;font-size:14px}
.ft .grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:28px}
@container (max-width:760px){.ft .grid{grid-template-columns:1fr 1fr}.ft .brand{grid-column:1/-1}}
.ft .lock{color:#FFFFFF;margin-bottom:12px}
.ft .purpose{color:#D6D9E0;max-width:36ch;margin:0 0 12px}
.ft .tg{font:600 14px Poppins,"Noto Sans Devanagari",sans-serif;color:#FF8A6E}
.ft h4{color:#FFFFFF;font:600 14px Poppins,"Noto Sans Devanagari",sans-serif;margin:0 0 12px}
.ft ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ft a{color:#A9AEBB;text-decoration:none;transition:color .15s ease-out}
.ft a:hover{color:#FFFFFF}
.ft .legal{border-top:1px solid #2E3034;margin-top:36px;padding-top:20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="board">
  <div class="bar">
    <div><h1>Landing page design · v1</h1><p>Final palette, logo suite and approved copy. Real light-mode page, all 10 sections.</p></div>
    <div class="ctl">
      <div class="seg" role="group" aria-label="Device" id="dev"><button type="button" data-v="desktop" aria-pressed="true">Desktop</button><button type="button" data-v="phone" aria-pressed="false">Phone</button></div>
      <div class="seg" role="group" aria-label="Research notes" id="whyt"><button type="button" data-w="off" aria-pressed="true">Clean</button><button type="button" data-w="on" aria-pressed="false">Show why</button></div>
    </div>
  </div>
  <div class="stage"><div class="frame" id="frame"><div class="lp" id="lp"></div></div></div>
</div>

/* ---------- copy: English and Hindi ---------- */
const C={

 findH:"Find your exam",findP:"Syllabus, lessons, practice and mocks for your exam, in one place.",search:"Search SSC CGL, IBPS PO, RRB NTPC…",chips:["SSC CGL","RRB NTPC","IBPS PO","UP Police","CTET"],
 examH:"Choose your exam",examP:"Start with the exam you are preparing for. Everything inside follows its syllabus.",

 <g transform="translate(0 6)"><circle cx="${cx}" cy="${cy}" r="95" fill="url(#gl${u})"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#C9CFFF" stroke-width="2" stroke-dasharray="6 7"/>
 <g transform="translate(${cx-20} ${cy-40})">${mark(40)}</g>
 <text x="${cx}" y="${cy+22}" text-anchor="middle" font-size="16" font-weight="700" fill="#18191B" font-family="Poppins,'Noto Sans Devanagari',sans-serif">${t.tag}</text>${nodes}</g></svg>`}
