# DEPLOY-GATE-1 (owner, 2026-11-23, choice (i)) — the ONE required Vercel Deployment Check: commit status "deploy-smoke".
# Vercel builds every push to main but promotes it to couragelibrary.in / www / couragelibrary-next.vercel.app only once
# this status is "success" on the deployment's commit. Vercel starts this workflow with repository_dispatch
# `vercel.deployment.ready` ("triggers after the deployment is created, and before checks are run" —
# https://vercel.com/docs/deployment-checks; event list: https://vercel.com/docs/git/vercel-for-github).
# The result is reported with Vercel's status action (vercel/repository-dispatch actions/status, pinned): "pending" at
# the start, then "failure" if any step failed, else "success" — as a COMMIT STATUS on client_payload.git.sha, i.e. on
# the deployment's commit, not on main's HEAD. The job id is deliberately NOT "deploy-smoke": a repository_dispatch run's
# own check run lands on main's HEAD, and must never be mistaken for the required check of another commit.
# Rules for this file (the status action reads the steps' conclusions of the FIRST job of the run):
#   one job only · no continue-on-error · no step-level timeout (a cancelled step would not count as a failure) ·
#   every step bounded by its own script timeout, well inside the job limit.
# Order: report pending → validate the payload (production, 40-hex sha, couragelibrary-next-*.vercel.app over https) →
# sha is an ancestor-or-equal of main → wait for CI (scope / offline / server-checks of that sha, all success) →
# check out that sha → anonymous read-only smoke of the deployment URL through the protection bypass, incl. /api/health
# == that sha. Any mismatch fails BEFORE the bypass header is ever sent. The URL is logged as host only.
# The repository is PUBLIC: every gate through scripts/ci/run-quiet.cjs (summary lines only), log-scanned, no artifacts.

name: deploy-smoke (pre-promotion)

on:
  repository_dispatch:
    types: [vercel.deployment.ready]

run-name: deploy-smoke ${{ github.event.client_payload.environment }} ${{ github.event.client_payload.git.shortSha }}

permissions: {}

concurrency:
  group: deploy-smoke-${{ github.event.client_payload.git.sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20.19.4'
  CI: 'true'
  CI_QUIET: '1'

jobs:
  pre-promotion-smoke:
    runs-on: ubuntu-24.04
    # bounded inside: CI wait ≤ 26 min + install + smoke ≤ 10 min; the steps time out themselves long before this limit
    timeout-minutes: 45
    environment: ci-public
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: write
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # the payload is read through env only (never interpolated into a script) and validated before any use
      PAYLOAD_ENV: ${{ github.event.client_payload.environment }}
      PAYLOAD_SHA: ${{ github.event.client_payload.git.sha }}
      PAYLOAD_URL: ${{ github.event.client_payload.url }}
    steps:
      - name: Report to Vercel (commit status "deploy-smoke" on the deployment's commit)
        uses: vercel/repository-dispatch/actions/status@30f760c6640485cd92f8c785ef361382555fb712 # v1
        with:
          name: deploy-smoke
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the payload (production, 40-hex sha, https couragelibrary-next-*.vercel.app; host only in the log)
        id: payload
        run: node scripts/ci/pre-promotion.cjs --validate
      - name: The commit is on main (ancestor-or-equal of main)
        run: |
          if git merge-base --is-ancestor "$PAYLOAD_SHA" origin/main; then echo "PASS  ON-MAIN ${PAYLOAD_SHA::7} is on main"; else echo "FAIL  ON-MAIN ${PAYLOAD_SHA::7} is not on main — not promoted"; exit 1; fi
      - name: Wait for CI of exactly this commit (scope, offline, server-checks — all success; ≤ 25 min)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/run-quiet.cjs --id CI-CHECKS --timeout 1560 -- node scripts/ci/pre-promotion.cjs --wait-checks --sha "$PAYLOAD_SHA" --timeout 1500
      - name: Check out the deployment's commit (its smoke script)
        run: git -c advice.detachedHead=false checkout --detach "$PAYLOAD_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24)
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install (lockfile only)
        run: timeout 600 npm ci --no-audit --no-fund --loglevel=error
      - name: Mask values derived from secrets
        run: node scripts/ci/mask-derived.cjs
      - name: Anonymous smoke of the deployment, before promotion (summary only)
        env:
          DEPLOY_URL: ${{ steps.payload.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/ci/run-quiet.cjs --id DEPLOY-SMOKE --timeout 600 -- node scripts/smoke/anonymous-smoke.cjs "$DEPLOY_URL" --bypass --expect-sha "$PAYLOAD_SHA"
      - name: Log scan of the captured outputs
        if: always() && steps.payload.outcome == 'success'
        run: node scripts/ci/log-scan.cjs "$RUNNER_TEMP/ci-quiet"
