# CI-1 Stage 2 (architect ruling, 2026-10-18) — permanent gates on GitHub-hosted runners.
# Design: docs/ops/CI1_DESIGN.md. Report: docs/reports/ops/CI1_STAGE2_REPORT.md.
# Trigger: MANUAL DISPATCH ONLY until the owner's first manual run is green (see the TODO below).
# No pull_request trigger, ever: no fork / branch code runs with secrets. All actions pinned by commit SHA.

name: ci-gates

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Run the live (DB) gates'
        type: boolean
        default: true
      prod_smoke:
        description: 'Run the anonymous production smoke'
        type: boolean
        default: true
  # TODO(CI-1 Stage 2 ruling, 2026-10-18): enable after the owner's first manual run is green, in a separate commit:
  # push:
  #   branches: [main]
  #   paths-ignore:
  #     - 'docs/**'
  #     - '**/*.md'
  #   # never ignored: scripts/**, app/**, supabase/**, package*.json, .github/**

permissions:
  contents: read

# One run at a time against couragelibrary-next; never cancelled mid-suite.
concurrency:
  group: couragelibrary-next-db
  cancel-in-progress: false

env:
  NODE_VERSION: '20.19.4'
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ------------------------------------------------------------------ (a) offline gates — no secrets
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund
      - name: Guard — TLS verification is never disabled
        run: test -z "${NODE_TLS_REJECT_UNAUTHORIZED:-}"
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Lint
        run: npm run lint
      - name: Offline suites
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          for t in \
            "scripts/ci/test_ci_scripts.cjs" \
            "scripts/test_no_runtime_db.cjs" \
            "scripts/test_design_ratchet.cjs" \
            "scripts/test_ux1b_shell.cjs" \
            "scripts/test_qf1_question_factory.cjs" \
            "scripts/test_sec1b_admin_authz.cjs" \
            "scripts/test_sec1c_admin_pages.cjs" \
            "scripts/test_sec1d_redirects.cjs" \
            "scripts/test_qb_key1.cjs --offline" \
            "scripts/test_drill1.cjs --offline" \
            "scripts/test_syl_import1.cjs --offline" \
            "scripts/test_gap2_4b_readers.cjs --offline" \
            "scripts/test_gap2_4b_editor.cjs" \
            "scripts/test_ux2a_landing.cjs --offline" \
            "scripts/test_types1.cjs --offline" \
            "scripts/smoke/anonymous-smoke.cjs --self-test"; do
            echo "::group::$t"
            node $t 2>&1 | tee -a "$RUNNER_TEMP/logs/offline.log"
            echo "::endgroup::"
          done
      - name: Log scan
        if: always()
        run: node scripts/ci/log-scan.cjs "$RUNNER_TEMP/logs"

  # ------------------------------------------------------------------ (b) live gates — environment ci-live (main only)
  live:
    needs: offline
    if: inputs.live
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: ci-live
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      QA_STUDENT_PASSWORD: ${{ secrets.QA_STUDENT_PASSWORD }}
      QA_STAFF_PASSWORD: ${{ secrets.QA_STAFF_PASSWORD }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
      E2E_STUDENT_EMAIL: qa-student@courage-library.test
      E2E_STUDENT_PASSWORD_KEY: QA_STUDENT_PASSWORD
      E2E_KEEP_USER: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund
      - name: Mask values derived from secrets
        run: node scripts/ci/mask-derived.cjs
      - name: CA certificate for verified TLS (from secret, mode 0600, runner temp)
        env:
          PROD_CA_PEM: ${{ secrets.PROD_CA_PEM }}
        run: |
          umask 077
          printf '%s\n' "$PROD_CA_PEM" > "$RUNNER_TEMP/prod-ca.pem"
          echo "PROD_CA_PATH=$RUNNER_TEMP/prod-ca.pem" >> "$GITHUB_ENV"
      - name: Guard — TLS verification is never disabled
        run: test -z "${NODE_TLS_REJECT_UNAUTHORIZED:-}"
      - name: Production build (local to the runner)
        run: npm run build
      - name: Pre-flight — network probe + no open own DB sessions
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          node scripts/diag/net-probe.cjs --n=3 2>&1 | tee "$RUNNER_TEMP/logs/preflight.log"
          node scripts/ci/db-sessions.cjs --fail-on-own-open 2>&1 | tee -a "$RUNNER_TEMP/logs/preflight.log"
      - name: Live gates (one server, documented GATE ORDER; #56 smokes 3x)
        run: |
          set -o pipefail
          node scripts/live/with-server.cjs --port=3100 --log="$RUNNER_TEMP/logs/server.log" -- \
            "node scripts/test_secdef_ratchet.cjs" \
            "node scripts/test_sec_hotfix4_rls.cjs" \
            "node scripts/test_qf1_db.cjs" \
            "node scripts/test_qb_key1.cjs" \
            "node scripts/test_secdef_s2_1.cjs" \
            "node scripts/test_types1_close.cjs" \
            "node scripts/test_gap2_4a_syllabus.cjs" \
            "node scripts/test_gap2_4b_readers.cjs --base=http://localhost:3100" \
            "node scripts/test_syl_import1.cjs" \
            "node scripts/e2e/cleanup-student.cjs" \
            "node scripts/e2e/student-journey.cjs" \
            "node scripts/e2e/assert-mistake-lineage.cjs" \
            "node scripts/test_drill1.cjs" \
            "node scripts/e2e/student-drill.cjs" \
            "node scripts/e2e/cleanup-student.cjs" \
            "node scripts/e2e/ensure-student-fixture.cjs http://localhost:3100" \
            "node scripts/smoke/signed-in-smoke.cjs student-mistake http://localhost:3100" \
            "node scripts/smoke/signed-in-smoke.cjs student-mistake http://localhost:3100" \
            "node scripts/smoke/signed-in-smoke.cjs student-mistake http://localhost:3100" \
            "node scripts/smoke/signed-in-smoke.cjs admin-pages http://localhost:3100" \
            "node scripts/smoke/signed-in-smoke.cjs admin-pages http://localhost:3100" \
            "node scripts/smoke/signed-in-smoke.cjs admin-pages http://localhost:3100" \
            "node scripts/smoke/signed-in-smoke.cjs student-pages http://localhost:3100" \
            "node scripts/smoke/signed-in-smoke.cjs staff-content http://localhost:3100" \
            "node scripts/smoke/signed-in-smoke.cjs admin-home http://localhost:3100" \
            "node scripts/test_ux2a_landing.cjs http://localhost:3100" \
            "node scripts/test_ca_routes.cjs http://localhost:3100" \
            "node scripts/test_sec1b_admin_authz.cjs --live" \
            "node scripts/test_sec1c_admin_pages.cjs --live http://localhost:3100" \
            "node scripts/test_sec1d_redirects.cjs --live http://localhost:3100" \
            "node scripts/smoke/anonymous-smoke.cjs http://localhost:3100" \
            2>&1 | tee "$RUNNER_TEMP/logs/live.log"
      - name: Cleanup — QA data back to the kept smoke fixture (always)
        if: always()
        run: |
          node scripts/e2e/cleanup-student.cjs 2>&1 | tee -a "$RUNNER_TEMP/logs/cleanup.log" || true
          node scripts/live/with-server.cjs --port=3100 --log="$RUNNER_TEMP/logs/server-cleanup.log" -- \
            "node scripts/e2e/ensure-student-fixture.cjs http://localhost:3100" 2>&1 | tee -a "$RUNNER_TEMP/logs/cleanup.log" || true
      - name: Orphan-session check (always; never terminates)
        if: always()
        run: node scripts/ci/db-sessions.cjs --fail-on-own-open 2>&1 | tee -a "$RUNNER_TEMP/logs/sessions.log"
      - name: Log scan (always)
        if: always()
        run: node scripts/ci/log-scan.cjs "$RUNNER_TEMP/logs"
      - name: Upload scanned logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-gate-logs
          path: ${{ runner.temp }}/logs/
          retention-days: 7

  # ------------------------------------------------------------------ (c) anonymous production smoke — environment ci-public
  prod-smoke:
    needs: offline
    if: inputs.prod_smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: ci-public
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund
      - name: Mask values derived from secrets
        run: node scripts/ci/mask-derived.cjs
      - name: Wait for the Vercel deployment of this commit
        run: node scripts/smoke/wait-for-deploy.cjs https://couragelibrary-next.vercel.app "${GITHUB_SHA::7}"
      - name: Anonymous production smoke (anonymous GETs only)
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          node scripts/smoke/anonymous-smoke.cjs https://couragelibrary-next.vercel.app 2>&1 | tee "$RUNNER_TEMP/logs/prod.log"
      - name: Log scan
        if: always()
        run: node scripts/ci/log-scan.cjs "$RUNNER_TEMP/logs"
