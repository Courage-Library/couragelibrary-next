# CI-1 Stage 2 + PUBLIC-HARDEN-1 (#57: the repository is PUBLIC — logs are world-readable).
# Design: docs/ops/CI1_DESIGN.md. Reports: docs/reports/ops/CI1_STAGE2_REPORT.md, docs/reports/ops/PUBLIC_HARDEN1_REPORT.md.
# Public-repo rules enforced here:
#   - NO artifact upload of any kind
#   - every gate runs through scripts/ci/run-quiet.cjs: its full output is captured to the runner's temp dir (discarded
#     with the runner), log-scanned BEFORE anything is printed, and only "<ID> PASS|FAIL exit n — counts · failing [IDs]"
#     reaches the log; security gates therefore print check IDs only
#   - CI_QUIET=1: with-server.cjs never prints the server log tail
# Trigger: push to main (code changes; docs-only skipped) + manual dispatch + nightly schedule (live gates: schedule / dispatch
# only, decision #73). No pull_request trigger, ever.
# All actions pinned by commit SHA.

name: ci-gates

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Run the live (DB) gates'
        type: boolean
        default: true
      prod_smoke:
        description: 'Run the anonymous production smoke'
        type: boolean
        default: true
  # CI-1 finalised (architect, 2026-10-21; first runs green): every push to main runs the gates, except docs-only changes.
  # `paths` with ordered negations (later patterns win): docs/** and *.md are skipped, but scripts/**, app/**, lib/**,
  # services/**, components/**, supabase/**, package*.json and .github/** are ALWAYS included (even .md files there).
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'scripts/**'
      - 'app/**'
      - 'lib/**'
      - 'services/**'
      - 'components/**'
      - 'supabase/**'
      - 'package*.json'
      - '.github/**'
  # CI-LEAN-1 (decision #73): the live (DB) suite is NIGHTLY + manual only — ~02:30 IST (21:00 UTC). Push runs are
  # offline + server-checks + prod-smoke.
  schedule:
    - cron: '0 21 * * *'

permissions:
  contents: read

# One run at a time. GitHub keeps at most ONE pending run per group: a newer run replaces an older PENDING one, and an
# in-progress run (e.g. a live job) is never cancelled (cancel-in-progress: false).
concurrency:
  group: couragelibrary-next-db
  cancel-in-progress: false

env:
  NODE_VERSION: '20.19.4'
  CI: 'true'
  CI_QUIET: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ------------------------------------------------------------------ (a) offline gates — no secrets
  offline:
    runs-on: ubuntu-24.04
    # CI-FIX-1: every job has a hard limit so a run can never hang for hours (green: offline ~1 min)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24)
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Guard — TLS verification is never disabled
        run: test -z "${NODE_TLS_REJECT_UNAUTHORIZED:-}"
      - name: Offline gates (summary lines only)
        run: |
          q() { node scripts/ci/run-quiet.cjs --id "$1" -- "${@:2}"; }
          fail=0
          q TSC npx tsc --noEmit -p . || fail=1
          q LINT npm run lint || fail=1
          q CI-SUPPORT node scripts/ci/test_ci_scripts.cjs || fail=1
          q NO-PERSONAL-DATA node scripts/test_no_personal_data.cjs || fail=1
          q NO-LOCAL-ONLY node scripts/test_no_local_only_tracked.cjs || fail=1
          q NO-RUNTIME-DB node scripts/test_no_runtime_db.cjs || fail=1
          q DESIGN-RATCHET node scripts/test_design_ratchet.cjs || fail=1
          q BRAND1 node scripts/test_brand1.cjs || fail=1
          q BRAND2 node scripts/test_brand2.cjs || fail=1
          q UX1B-SHELL node scripts/test_ux1b_shell.cjs || fail=1
          q QF1-OFFLINE node scripts/test_qf1_question_factory.cjs || fail=1
          q SEC1B node scripts/test_sec1b_admin_authz.cjs || fail=1
          q SEC1C node scripts/test_sec1c_admin_pages.cjs || fail=1
          q SEC1D node scripts/test_sec1d_redirects.cjs || fail=1
          q QBKEY1-OFFLINE node scripts/test_qb_key1.cjs --offline || fail=1
          q DRILL1-OFFLINE node scripts/test_drill1.cjs --offline || fail=1
          q SYLIMPORT1-OFFLINE node scripts/test_syl_import1.cjs --offline || fail=1
          q READERS-OFFLINE node scripts/test_gap2_4b_readers.cjs --offline || fail=1
          q EDITOR node scripts/test_gap2_4b_editor.cjs || fail=1
          q UX2A-OFFLINE node scripts/test_ux2a_landing.cjs --offline || fail=1
          q UX2B-OFFLINE node scripts/test_ux2b_public.cjs || fail=1
          q AUTH1-OFFLINE node scripts/test_auth1.cjs || fail=1
          q AUTH1-2B1-OFFLINE node scripts/test_auth1_2b1.cjs || fail=1
          q AUTH1-2B2-OFFLINE node scripts/test_auth1_2b2.cjs || fail=1
          q TYPES1-OFFLINE node scripts/test_types1.cjs --offline || fail=1
          q REFSCAN-SELFTEST node scripts/smoke/anonymous-smoke.cjs --self-test || fail=1
          q NPD-SELFTEST node scripts/test_no_personal_data.cjs --self-test || fail=1
          q LOCAL-ONLY-SELFTEST node scripts/test_no_local_only_tracked.cjs --self-test || fail=1
          q QA-SESSION-UNIT node scripts/test_qa_session.cjs || fail=1
          q ONBOARDING-F0 node scripts/test_onboarding_f0.cjs || fail=1
          q UXFIX1 node scripts/test_uxfix1.cjs || fail=1
          q F1-EXAM-PAGE node scripts/test_f1_exam_page.cjs || fail=1
          q F2-PRACTICE node scripts/test_f2_practice.cjs || fail=1
          q EXAM-FINALIZE1 node scripts/test_exam_finalize1.cjs || fail=1
          q F3-PLAYER node scripts/test_f3_player.cjs || fail=1
          q F4-RESULT node scripts/test_f4_result.cjs || fail=1
          q PROCTOR-LOG1 node scripts/test_proctor_log1.cjs || fail=1
          q LEADERBOARD-GATE1 node scripts/test_leaderboard_gate1.cjs || fail=1
          q F6-LEARN node scripts/test_f6_learn.cjs || fail=1
          q F7-CA node scripts/test_f7_ca.cjs || fail=1
          q F11-SUPPORT node scripts/test_f11_support.cjs || fail=1
          q MEMORY-LOCK-F5 node scripts/test_memory_lock_f5.cjs || fail=1
          q F8-PROFILE node scripts/test_f8_profile.cjs || fail=1
          q F11-TICKETS node scripts/test_f11_tickets.cjs || fail=1
          q FLAGS-LIVE-STATIC node scripts/test_flags_live_static.cjs || fail=1
          q ADMIN-MFA node scripts/test_admin_mfa.cjs || fail=1
          q PLAYER-RESUME node scripts/test_player_resume.cjs || fail=1
          q Q7-REPORT-LINK node scripts/test_q7_report_link.cjs || fail=1
          q AGE-18 node scripts/test_age18.cjs || fail=1
          q SILENT-FAIL-1 node scripts/test_silent_fail1.cjs || fail=1
          q COINS-FREEZE node scripts/test_coins_freeze.cjs || fail=1
          q F9B-PAYMENTS node scripts/test_f9b_payments.cjs || fail=1
          q ADMIN-D1-D2 node scripts/test_admin_d1_d2.cjs || fail=1
          q ADMIN-UX1B node scripts/test_admin_ux1b.cjs || fail=1
          q STUDIO-P2 node scripts/test_studio_phase2.cjs || fail=1
          q MISTAKE-VERSION-1 node scripts/test_mistake_version1.cjs || fail=1
          q STUDIO-P3 node scripts/test_studio_phase3.cjs || fail=1
          q CA1-TAXONOMY node scripts/test_ca1_taxonomy.cjs || fail=1
          q GAP2-1B-OFFLINE node scripts/test_gap2_1b_taxonomy.cjs || fail=1
          q CA2-INTAKE node scripts/test_ca2_intake.cjs || fail=1
          q LIVE-LOCK-SWEEP node scripts/test_live_lock_sweep.cjs || fail=1
          q CA3-LESSONS node scripts/test_ca3_lessons.cjs || fail=1
          q CA4-LESSONS node scripts/test_ca4_lessons.cjs || fail=1
          q CA5-COURSES node scripts/test_ca5_courses.cjs || fail=1
          q CA6-SEO node scripts/test_ca6_seo.cjs || fail=1
          q GEN-CHECK-1 node scripts/test_gen_check1.cjs || fail=1
          q SESSION-RACE-1 node scripts/test_session_race1.cjs || fail=1
          q CA7 node scripts/test_ca7.cjs || fail=1
          q LAUNCH-MODE-1 node scripts/test_launch_mode1.cjs || fail=1
          q INTAKE-ASSIST-1 node scripts/test_intake_assist1.cjs || fail=1
          q SYLLABUS-UI-1 node scripts/test_syllabus_ui1.cjs || fail=1
          q NAV-IA-1 node scripts/test_nav_ia1.cjs || fail=1
          q LESSON-NODE-ID-1 node scripts/test_lesson_node_id1.cjs || fail=1
          q IST-TIME node scripts/test_ist_time.cjs || fail=1
          q LESSON-QUALITY-1 node scripts/test_lesson_quality1.cjs || fail=1
          q EXAM-LOGO-1 node scripts/test_exam_logo1.cjs || fail=1
          q MIGRATION-RUNNER-SELFTEST node scripts/db/apply-migration.cjs --self-test || fail=1
          q KILL-LEFTOVER-SELFTEST node scripts/ci/kill-leftover-server.cjs --self-test || fail=1
          exit $fail
      - name: Log scan of the captured outputs
        if: always()
        run: node scripts/ci/log-scan.cjs "$RUNNER_TEMP/ci-quiet"

  # ------------------------------------------------------------------ (a2) server checks — no secrets, no DB (decision #69)
  # The owner's machine cannot hold the 2 GB free-memory floor for a local `next start`, so the server-based checks
  # that need NO database run here: one build, then the local production server under the Supabase blackhole preload
  # (every *.supabase.co / *.supabase.in / *.invalid connection refused or hung inside the server; nothing leaves the runner).
  # The Supabase URL / key below are FAKE placeholders, not secrets. No environment, no secrets, no artifacts.
  server-checks:
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # CI-LEAN-1: reserved .invalid TLD (RFC 6761) — can never resolve to a real host, even without the blackhole
      NEXT_PUBLIC_SUPABASE_URL: https://ciblackhole.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-fake-anon-key
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-fake-anon-key
      # Cloudflare's PUBLIC always-pass TEST site key, and a test Google client id (no Google request is made)
      CI_TURNSTILE_TEST_SITE_KEY: 1x00000000000000000000AA
      CI_GOOGLE_TEST_CLIENT_ID: ci-test-client.apps.googleusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24)
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Guard — TLS verification is never disabled
        run: test -z "${NODE_TLS_REJECT_UNAUTHORIZED:-}"
      - name: Production build (summary only)
        # CI-FLAKE-1: full stacks; on a failure the crashed route, node / next / cpus / memory (min free while building)
        # and a sanitized copy of the log for the failure-only artifact below
        env:
          NODE_OPTIONS: --stack-trace-limit=100
        run: node scripts/ci/run-quiet.cjs --id SC-BUILD --timeout 900 --crash-message --build-diag --keep-log "$RUNNER_TEMP/build-diag" -- npm run build
      - name: CI-FLAKE-1 — sanitized build log (failure only; scanned lines redacted, no env)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: build-log-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-diag/
          if-no-files-found: ignore
          retention-days: 7
      - name: Server checks (4 bounded server runs; summary lines only)
        env:
          # step-level only (the preload file exists after checkout); inert unless AUTH1_BLACKHOLE is set in `next start`
          NODE_OPTIONS: --require ./scripts/live/supabase-blackhole.cjs
        run: |
          mkdir -p "$RUNNER_TEMP/server" "$RUNNER_TEMP/ci-quiet"
          Q='node scripts/ci/run-quiet.cjs --id'
          WS='node scripts/live/with-server.cjs --port=3300 --health-path=auth/login --gate-timeout=300'
          fail=0
          # 1) flags OFF (Supabase refused): no Turnstile, no Google markup or nonce
          # PERF-LESSON-1: BRAND2-PROBE P-07 reads this build's route table (the quiet runner's SC-BUILD.log)
          BUILD_LOG="$RUNNER_TEMP/ci-quiet/SC-BUILD.log" AUTH1_BLACKHOLE=refuse $WS --log="$RUNNER_TEMP/server/off.log" -- \
            "$Q AUTH1-2B2-PROBE-OFF -- node scripts/test_auth1_2b2.cjs --probe" \
            "$Q AUTH1-2B1-PROBE-OFF -- node scripts/test_auth1_2b1.cjs --probe" \
            "$Q BRAND2-PROBE -- node scripts/test_brand2.cjs --probe" || fail=1
          # 2) flags ON with test keys (Supabase refused): widget on the 3 pages; nonce mint / reuse / GET-only
          AUTH1_BLACKHOLE=refuse AUTH_CAPTCHA_ENABLED=true NEXT_PUBLIC_TURNSTILE_SITE_KEY="$CI_TURNSTILE_TEST_SITE_KEY" \
            AUTH_GOOGLE_ENABLED=true NEXT_PUBLIC_GOOGLE_CLIENT_ID="$CI_GOOGLE_TEST_CLIENT_ID" \
            $WS --log="$RUNNER_TEMP/server/on.log" -- \
            "$Q AUTH1-2B2-PROBE-ON -- node scripts/test_auth1_2b2.cjs --probe" \
            "$Q AUTH1-2B1-PROBE-ON -- node scripts/test_auth1_2b1.cjs --probe" || fail=1
          # 3) + 4) AUTH-1 resilience: Supabase refused, then hanging
          AUTH1_BLACKHOLE=refuse $WS --log="$RUNNER_TEMP/server/res-refuse.log" -- \
            "$Q AUTH1-RESILIENCE-REFUSE -- node scripts/test_auth1.cjs --resilience=refuse" || fail=1
          AUTH1_BLACKHOLE=hang $WS --log="$RUNNER_TEMP/server/res-hang.log" -- \
            "$Q AUTH1-RESILIENCE-HANG -- node scripts/test_auth1.cjs --resilience=hang" || fail=1
          exit $fail
      - name: Log scan of the captured outputs (always)
        if: always()
        run: node scripts/ci/log-scan.cjs "$RUNNER_TEMP/ci-quiet"

  # ------------------------------------------------------------------ (b) live gates — environment ci-live (main only)
  live-journeys:
    # CI-LIVE-SPLIT-1 (architect 2026-10-27): student journeys + student-data smokes (the only job that writes QA student data; it runs the final cleanup / fixture). Parallel with live-gates: own runner, server and QA session cache; same secrets.
    needs: offline
    # CI-LEAN-1 (decision #73): nightly schedule or a manual dispatch with live=true — never on push
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live)
    runs-on: ubuntu-24.04
    # CI-FIX-1: hard limit (green runs ~30 min); the always-run cleanup steps still execute after a timeout
    timeout-minutes: 45
    environment: ci-live
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      QA_STUDENT_PASSWORD: ${{ secrets.QA_STUDENT_PASSWORD }}
      QA_STAFF_PASSWORD: ${{ secrets.QA_STAFF_PASSWORD }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
      E2E_STUDENT_EMAIL: qa-student@courage-library.test
      E2E_STUDENT_PASSWORD_KEY: QA_STUDENT_PASSWORD
      E2E_KEEP_USER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24)
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Mask values derived from secrets
        run: node scripts/ci/mask-derived.cjs
      - name: CA certificate for verified TLS (from secret, mode 0600, runner temp)
        env:
          PROD_CA_PEM: ${{ secrets.PROD_CA_PEM }}
        run: |
          umask 077
          printf '%s\n' "$PROD_CA_PEM" > "$RUNNER_TEMP/prod-ca.pem"
          echo "PROD_CA_PATH=$RUNNER_TEMP/prod-ca.pem" >> "$GITHUB_ENV"
      - name: Guard — TLS verification is never disabled
        run: test -z "${NODE_TLS_REJECT_UNAUTHORIZED:-}"
      - name: Production build (summary only)
        # CI-FLAKE-1: full stacks; on a failure the crashed route, node / next / cpus / memory (min free while building)
        # and a sanitized copy of the log for the failure-only artifact below
        env:
          NODE_OPTIONS: --stack-trace-limit=100
        run: node scripts/ci/run-quiet.cjs --id BUILD --timeout 1200 --crash-message --build-diag --keep-log "$RUNNER_TEMP/build-diag" -- npm run build
      - name: CI-FLAKE-1 — sanitized build log (failure only; scanned lines redacted, no env)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: build-log-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-diag/
          if-no-files-found: ignore
          retention-days: 7
      - name: Pre-flight — network probe + no open own DB sessions
        run: |
          mkdir -p "$RUNNER_TEMP/server" "$RUNNER_TEMP/ci-quiet"
          node scripts/ci/run-quiet.cjs --id NET-PROBE -- node scripts/diag/net-probe.cjs --n=3
          node scripts/ci/run-quiet.cjs --id DB-SESSIONS-PRE -- node scripts/ci/db-sessions.cjs --fail-on-own-open
      - name: Live journeys + student smokes (one server, documented GATE ORDER; #56 smokes 3x; summary lines only)
        env:
          # CI-LEAN-1: one QA session per identity per job (0600 files, runner temp, never printed) + safe failure IDs
          QA_SESSION_CACHE_DIR: ${{ runner.temp }}/qa-session
          QA_SESSION_DIAG: '1'
        run: |
          Q='node scripts/ci/run-quiet.cjs --caps scripts/ci/live-gate-caps.json --id'
          B='http://localhost:3100'
          node scripts/live/with-server.cjs --port=3100 --log="$RUNNER_TEMP/server/server.log" -- \
            "$Q QA-SESSION-PROBE -- node scripts/live/qa-session.cjs --probe" \
            "$Q QF1-DB -- node scripts/test_qf1_db.cjs" \
            "$Q CLEANUP-1 -- node scripts/e2e/cleanup-student.cjs" \
            "$Q JOURNEY -- node scripts/e2e/student-journey.cjs" \
            "$Q LINEAGE -- node scripts/e2e/assert-mistake-lineage.cjs" \
            "$Q DRILL1 -- node scripts/test_drill1.cjs" \
            "$Q STUDENT-DRILL -- node scripts/e2e/student-drill.cjs" \
            "$Q CLEANUP-2 -- node scripts/e2e/cleanup-student.cjs" \
            "$Q FIXTURE -- node scripts/e2e/ensure-student-fixture.cjs $B" \
            "$Q SMOKE-STUDENT-MISTAKE-1 -- node scripts/smoke/signed-in-smoke.cjs student-mistake $B" \
            "$Q SMOKE-STUDENT-MISTAKE-2 -- node scripts/smoke/signed-in-smoke.cjs student-mistake $B" \
            "$Q SMOKE-STUDENT-MISTAKE-3 -- node scripts/smoke/signed-in-smoke.cjs student-mistake $B" \
            "$Q VAULT-HEALTH -- node scripts/live/test_vault_health.cjs" \
            "$Q F9-PRICING -- node scripts/live/test_f9_pricing.cjs" \
            "$Q SMOKE-STUDENT-PAGES -- node scripts/smoke/signed-in-smoke.cjs student-pages $B"
      - name: Cleanup — QA data back to the kept smoke fixture (always)
        if: always()
        env:
          QA_SESSION_CACHE_DIR: ${{ runner.temp }}/qa-session
          QA_SESSION_DIAG: '1'
        run: |
          node scripts/ci/run-quiet.cjs --id CLEANUP-FINAL -- node scripts/e2e/cleanup-student.cjs || true
          # CI-FIX-1: a cancelled / timed-out live step can leave its server on :3100 (run #13) — stop ONLY ours first
          node scripts/ci/kill-leftover-server.cjs --port=3100 || true
          node scripts/live/with-server.cjs --port=3100 --log="$RUNNER_TEMP/server/server-cleanup.log" -- \
            "node scripts/ci/run-quiet.cjs --id FIXTURE-FINAL -- node scripts/e2e/ensure-student-fixture.cjs http://localhost:3100" || true
      - name: Orphan-session check (always; never terminates)
        if: always()
        run: node scripts/ci/run-quiet.cjs --id DB-SESSIONS-POST -- node scripts/ci/db-sessions.cjs --fail-on-own-open
      - name: Log scan of the captured outputs (always)
        if: always()
        run: node scripts/ci/log-scan.cjs "$RUNNER_TEMP/ci-quiet"

  live-gates:
    # CI-LIVE-SPLIT-1 (architect 2026-10-27): security / DB / admin / flags / public gates (no QA student data writes). Parallel with live-journeys: own runner, server and QA session cache; same secrets.
    # CI-SPEED-1 (architect 2026-10-29): 3 parallel shards, each its own runner + server + QA session cache.
    #   db       — EVERY gate that writes the syllabus / taxonomy / lesson / course object group (the QA exam's advisory lock
    #              and publish index, the master-tree scope locks, the node-lesson / prompt-template / course-launch locks,
    #              SYLIMPORT1's trigger on exam_syllabus_nodes): serialized in ONE shard, exactly as before — isolation by
    #              serialization (docs/ops/CI_SPEED_1.md has the lock map)
    #   security — catalog / grants / authz gates + row-disjoint DB gates (own fixtures, no shared lock keys)
    #   pages    — read-only page checks and smokes against the shard's own local server
    # Timeouts: measured job time (dispatch 40919071379) × ~1.5; no check removed or relaxed.
    needs: offline
    # CI-LEAN-1 (decision #73): nightly schedule or a manual dispatch with live=true — never on push
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: db
            timeout: 40
          - shard: security
            timeout: 25
          - shard: pages
            timeout: 20
    # CI-FIX-1 + CI-SPEED-1: hard limit per shard (matrix.timeout)
    timeout-minutes: ${{ matrix.timeout }}
    environment: ci-live
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      QA_STUDENT_PASSWORD: ${{ secrets.QA_STUDENT_PASSWORD }}
      QA_STAFF_PASSWORD: ${{ secrets.QA_STAFF_PASSWORD }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
      E2E_STUDENT_EMAIL: qa-student@courage-library.test
      E2E_STUDENT_PASSWORD_KEY: QA_STUDENT_PASSWORD
      E2E_KEEP_USER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24)
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Mask values derived from secrets
        run: node scripts/ci/mask-derived.cjs
      - name: CA certificate for verified TLS (from secret, mode 0600, runner temp)
        env:
          PROD_CA_PEM: ${{ secrets.PROD_CA_PEM }}
        run: |
          umask 077
          printf '%s\n' "$PROD_CA_PEM" > "$RUNNER_TEMP/prod-ca.pem"
          echo "PROD_CA_PATH=$RUNNER_TEMP/prod-ca.pem" >> "$GITHUB_ENV"
      - name: Guard — TLS verification is never disabled
        run: test -z "${NODE_TLS_REJECT_UNAUTHORIZED:-}"
      - name: Production build (summary only)
        # CI-FLAKE-1: full stacks; on a failure the crashed route, node / next / cpus / memory (min free while building)
        # and a sanitized copy of the log for the failure-only artifact below
        env:
          NODE_OPTIONS: --stack-trace-limit=100
        run: node scripts/ci/run-quiet.cjs --id BUILD --timeout 1200 --crash-message --build-diag --keep-log "$RUNNER_TEMP/build-diag" -- npm run build
      - name: CI-FLAKE-1 — sanitized build log (failure only; scanned lines redacted, no env)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: build-log-${{ github.job }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-diag/
          if-no-files-found: ignore
          retention-days: 7
      - name: Pre-flight — network probe + no open own DB sessions
        run: |
          mkdir -p "$RUNNER_TEMP/server" "$RUNNER_TEMP/ci-quiet"
          node scripts/ci/run-quiet.cjs --id NET-PROBE -- node scripts/diag/net-probe.cjs --n=3
          node scripts/ci/run-quiet.cjs --id DB-SESSIONS-PRE -- node scripts/ci/db-sessions.cjs --fail-on-own-open
      - name: Live gates — shard db (syllabus / taxonomy / lesson / course writers, serialized; summary lines only)
        if: matrix.shard == 'db'
        env:
          # CI-LEAN-1: one QA session per identity per job (0600 files, runner temp, never printed) + safe failure IDs
          QA_SESSION_CACHE_DIR: ${{ runner.temp }}/qa-session
          QA_SESSION_DIAG: '1'
        run: |
          Q='node scripts/ci/run-quiet.cjs --caps scripts/ci/live-gate-caps.json --id'
          B='http://localhost:3100'
          node scripts/live/with-server.cjs --port=3100 --log="$RUNNER_TEMP/server/server.log" -- \
            "$Q QA-SESSION-PROBE -- node scripts/live/qa-session.cjs --probe" \
            "$Q RLS -- node scripts/test_sec_hotfix4_rls.cjs" \
            "$Q GAP2-4A -- node scripts/test_gap2_4a_syllabus.cjs" \
            "$Q READERS -- node scripts/test_gap2_4b_readers.cjs --base=$B" \
            "$Q SYLIMPORT1 -- node scripts/test_syl_import1.cjs --base=$B" \
            "$Q SYLIMPORT1-SCOPE-CONTROLS -- node scripts/live/test_suite_scope_controls.cjs" \
            "$Q CA1-TAXONOMY-LIVE -- node scripts/live/test_ca1_taxonomy.cjs" \
            "$Q CA2-INTAKE-LIVE -- node scripts/live/test_ca2_intake.cjs" \
            "$Q CA4-LESSONS-LIVE -- node scripts/live/test_ca4_lessons.cjs" \
            "$Q LESSON-PROMPT-2-LIVE -- node scripts/live/test_lesson_prompt_2.cjs" \
            "$Q CA5-COURSES-LIVE -- node scripts/live/test_ca5_courses.cjs" \
            "$Q CA7-LIVE -- node scripts/live/test_ca7.cjs" \
            "$Q LAUNCH-MODE-1-LIVE -- node scripts/live/test_launch_mode1.cjs" \
            "$Q INTAKE-ASSIST-1-LIVE -- node scripts/live/test_intake_assist1.cjs" \
            "$Q PUBLISH-IMPACT-LIVE -- node scripts/live/test_publish_impact.cjs" \
            "$Q PUBLISH-CONFIRM-LIVE -- node scripts/live/test_publish_confirm.cjs" \
            "$Q EXAM-LOGO-1-LIVE -- node scripts/live/test_exam_logo1.cjs"
      - name: Live gates — shard security (catalog / authz / row-disjoint DB gates; summary lines only)
        if: matrix.shard == 'security'
        env:
          # CI-LEAN-1: one QA session per identity per job (0600 files, runner temp, never printed) + safe failure IDs
          QA_SESSION_CACHE_DIR: ${{ runner.temp }}/qa-session
          QA_SESSION_DIAG: '1'
        run: |
          Q='node scripts/ci/run-quiet.cjs --caps scripts/ci/live-gate-caps.json --id'
          B='http://localhost:3100'
          node scripts/live/with-server.cjs --port=3100 --log="$RUNNER_TEMP/server/server.log" -- \
            "$Q QA-SESSION-PROBE -- node scripts/live/qa-session.cjs --probe" \
            "$Q SECDEF-RATCHET -- node scripts/test_secdef_ratchet.cjs" \
            "$Q QBKEY1 -- node scripts/test_qb_key1.cjs" \
            "$Q SECDEF-S2-1 -- node scripts/test_secdef_s2_1.cjs" \
            "$Q TYPES1-CLOSE -- node scripts/test_types1_close.cjs" \
            "$Q ADMIN-D1-D2 -- node scripts/live/test_admin_d1_d2.cjs" \
            "$Q CA3-LESSONS-LIVE -- node scripts/live/test_ca3_lessons.cjs" \
            "$Q LESSON-PERF -- node scripts/test_brand2.cjs --probe --only-route=auto:lesson" \
            "$Q CA6-SEO-LIVE -- node scripts/live/test_ca6_seo.cjs --base=$B" \
            "$Q FLAGS-LIVE -- node scripts/live/test_flags_live.cjs $B" \
            "$Q CA-ROUTES -- node scripts/test_ca_routes.cjs $B" \
            "$Q SEC1B-LIVE -- node scripts/test_sec1b_admin_authz.cjs --live" \
            "$Q SEC1C-LIVE -- node scripts/test_sec1c_admin_pages.cjs --live $B" \
            "$Q SEC1D-LIVE -- node scripts/test_sec1d_redirects.cjs --live $B"
      - name: Live gates — shard pages (page checks + smokes, #56 admin smoke 3x; summary lines only)
        if: matrix.shard == 'pages'
        env:
          # CI-LEAN-1: one QA session per identity per job (0600 files, runner temp, never printed) + safe failure IDs
          QA_SESSION_CACHE_DIR: ${{ runner.temp }}/qa-session
          QA_SESSION_DIAG: '1'
        run: |
          Q='node scripts/ci/run-quiet.cjs --caps scripts/ci/live-gate-caps.json --id'
          B='http://localhost:3100'
          node scripts/live/with-server.cjs --port=3100 --log="$RUNNER_TEMP/server/server.log" -- \
            "$Q QA-SESSION-PROBE -- node scripts/live/qa-session.cjs --probe" \
            "$Q SMOKE-ADMIN-PAGES-1 -- node scripts/smoke/signed-in-smoke.cjs admin-pages $B" \
            "$Q SMOKE-ADMIN-PAGES-2 -- node scripts/smoke/signed-in-smoke.cjs admin-pages $B" \
            "$Q SMOKE-ADMIN-PAGES-3 -- node scripts/smoke/signed-in-smoke.cjs admin-pages $B" \
            "$Q SMOKE-STAFF-CONTENT -- node scripts/smoke/signed-in-smoke.cjs staff-content $B" \
            "$Q SMOKE-ADMIN-HOME -- node scripts/smoke/signed-in-smoke.cjs admin-home $B" \
            "$Q UX2A-LIVE -- node scripts/test_ux2a_landing.cjs $B" \
            "$Q UX2B-LIVE -- node scripts/test_ux2b_public.cjs --live" \
            "$Q AUTH1-2B1-LIVE -- node scripts/test_auth1_2b1.cjs --live" \
            "$Q ANON-SMOKE-LOCAL -- node scripts/smoke/anonymous-smoke.cjs $B"
      - name: Orphan-session check (always; never terminates)
        if: always()
        run: node scripts/ci/run-quiet.cjs --id DB-SESSIONS-POST -- node scripts/ci/db-sessions.cjs --fail-on-own-open
      - name: Log scan of the captured outputs (always)
        if: always()
        run: node scripts/ci/log-scan.cjs "$RUNNER_TEMP/ci-quiet"

  # ------------------------------------------------------------------ (c) anonymous production smoke — environment ci-public
  prod-smoke:
    needs: offline
    # CI-LEAN-1: after a push (a new deployment) or on a manual dispatch with prod_smoke=true; not on the nightly schedule
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.prod_smoke)
    runs-on: ubuntu-24.04
    # CI-FIX-1: hard limit; the Vercel deploy wait inside is ≤ 16 min (WAIT-FOR-DEPLOY --timeout 960)
    timeout-minutes: 20
    environment: ci-public
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24)
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Mask values derived from secrets
        run: node scripts/ci/mask-derived.cjs
      - name: Wait for the Vercel deployment of this commit
        run: node scripts/ci/run-quiet.cjs --id WAIT-FOR-DEPLOY --timeout 960 -- node scripts/smoke/wait-for-deploy.cjs https://couragelibrary-next.vercel.app "${GITHUB_SHA::7}"
      - name: Anonymous production smoke (summary only)
        run: node scripts/ci/run-quiet.cjs --id ANON-SMOKE-PROD -- node scripts/smoke/anonymous-smoke.cjs https://couragelibrary-next.vercel.app
      - name: Log scan of the captured outputs
        if: always()
        run: node scripts/ci/log-scan.cjs "$RUNNER_TEMP/ci-quiet"
