# PAY-1 B4 (owner R1, 2026-11-18): GitHub Actions only TRIGGERS the reconciliation; the work runs in the Vercel route
# POST /api/cron/reconcile, which holds the Razorpay keys (Vercel env only — never here).
#   - auth: the one header `Authorization: Bearer $CRON_SECRET` (constant-time on the server); POST only
#   - DOMAIN-CUTOVER-2 (2026-11-22): the only secret here is CRON_SECRET. RECONCILE_URL is a repository VARIABLE (a public
#     URL) and must be exactly https://couragelibrary.in/api/cron/reconcile — any other value fails before the bearer is
#     sent, so the secret can only ever reach the production apex
#   - DEPLOY-BEFORE-ACTIVATE: nothing runs on the schedule until the owner sets the repository variable
#     PAYMENTS_RECONCILE_ENABLED=true, after the B4 app is on main and the production deploy is verified
#   - probe (manual run, input probe=true, only while the switch is off): one POST that must answer 200 { skipped }
#     (checkout closed → the route returns before any read); any other answer fails the run
#   - overlapping runs are safe (the route takes a lease; a second run answers "busy"); concurrency also queues them here
name: payments-reconcile

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: 'Probe once while PAYMENTS_RECONCILE_ENABLED is off: the route must answer "skipped"'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: payments-reconcile
  cancel-in-progress: false

jobs:
  trigger:
    if: vars.PAYMENTS_RECONCILE_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.probe && vars.PAYMENTS_RECONCILE_ENABLED != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST the reconcile route (counts only in the answer)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RECONCILE_URL: ${{ vars.RECONCILE_URL }}
          PROBE: ${{ vars.PAYMENTS_RECONCILE_ENABLED != 'true' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then echo "CRON_SECRET not set"; exit 1; fi
          if [ "${RECONCILE_URL}" != "https://couragelibrary.in/api/cron/reconcile" ]; then echo "RECONCILE_URL must be https://couragelibrary.in/api/cron/reconcile"; exit 1; fi
          code=$(curl -s -o body.json -w '%{http_code}' --max-time 90 -X POST -H "Authorization: Bearer ${CRON_SECRET}" "${RECONCILE_URL}")
          echo "HTTP ${code}"
          # the body holds counts only (never ids or user data)
          node -e 'const b=JSON.parse(require("fs").readFileSync("body.json","utf8"));const {ok,outcome,skipped,checked,counts,doubleCharges,refundsReplayed,refundsWaiting}=b;console.log(JSON.stringify({ok,outcome,skipped,checked,counts,doubleCharges,refundsReplayed,refundsWaiting}))' || true
          test "${code}" = "200"
          if [ "${PROBE}" = "true" ]; then node -e 'const b=JSON.parse(require("fs").readFileSync("body.json","utf8"));if(!(typeof b.skipped==="string"&&b.skipped)){console.log("PROBE FAIL: the route did not answer skipped");process.exit(1)}console.log("PROBE PASS: skipped="+b.skipped)'; fi
